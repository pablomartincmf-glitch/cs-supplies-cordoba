    <script>
        let availableProducts = [];
        let activeTab = 'M'; // Solapa activa por defecto: Monedas ('M')

        // Función auxiliar para obtener la descripción sin importar problemas de codificación de la tilde
        function getDescripcion(item) {
            if (item["Descripción"] !== undefined) return item["Descripción"];
            if (item["Descripci\ufffdn"] !== undefined) return item["Descripci\ufffdn"];
            // Busca cualquier clave que empiece con "Descripci"
            const descKey = Object.keys(item).find(k => k.toLowerCase().startsWith('descripci'));
            return descKey ? item[descKey] : 'Sin descripción';
        }

        // Obtiene el tipo de registro ('M', 'B', etc.) desde FIELD3 o Tipo
        function getItemType(item) {
            const rawType = item["FIELD3"] ?? item["Tipo"] ?? item["Categoria"] ?? item["Categoría"] ?? "";
            return String(rawType).trim().toUpperCase();
        }

        // Filtra la lista según la pestaña seleccionada
        function filterByTab(products, tab) {
            return products.filter(item => {
                const tipo = getItemType(item);
                if (tab === 'M') return tipo === 'M';
                if (tab === 'B') return tipo === 'B';
                return tipo !== 'M' && tipo !== 'B';
            });
        }

        // Actualiza los contadores numéricos de cada solapa
        function updateTabCounts() {
            document.getElementById('count-M').textContent = filterByTab(availableProducts, 'M').length;
            document.getElementById('count-B').textContent = filterByTab(availableProducts, 'B').length;
            document.getElementById('count-OTROS').textContent = filterByTab(availableProducts, 'OTROS').length;
        }

        // Cambia la solapa activa y vuelve a aplicar el filtro
        function selectTab(tab) {
            activeTab = tab;

            document.querySelectorAll('.tab-btn').forEach(btn => {
                const isSelected = btn.getAttribute('data-tab') === tab;
                const badge = btn.querySelector('span:last-child');

                if (isSelected) {
                    btn.classList.remove('border-transparent', 'text-gray-500', 'hover:text-gray-700', 'hover:border-gray-300', 'font-medium');
                    btn.classList.add('border-blue-600', 'text-blue-600', 'font-semibold');
                    badge.classList.remove('bg-gray-200', 'text-gray-700');
                    badge.classList.add('bg-blue-100', 'text-blue-700');
                } else {
                    btn.classList.remove('border-blue-600', 'text-blue-600', 'font-semibold');
                    btn.classList.add('border-transparent', 'text-gray-500', 'hover:text-gray-700', 'hover:border-gray-300', 'font-medium');
                    badge.classList.remove('bg-blue-100', 'text-blue-700');
                    badge.classList.add('bg-gray-200', 'text-gray-700');
                }
            });

            applyFilters();
        }

        // Aplica tanto el filtro de solapa como el de texto de búsqueda
        function applyFilters() {
            const term = document.getElementById('searchInput').value.toLowerCase().trim();
            const byTab = filterByTab(availableProducts, activeTab);

            const filtered = byTab.filter(item => {
                if (!term) return true;
                const nroStr = String(item["Nro"] ?? '').toLowerCase();
                const descStr = String(getDescripcion(item)).toLowerCase();
                return nroStr.includes(term) || descStr.includes(term);
            });

            renderProducts(filtered);
        }

        // Función para cargar el archivo stock.json
        async function loadStock() {
            const statusEl = document.getElementById('statusMessage');
            const gridEl = document.getElementById('productGrid');

            try {
                // Agregamos un timestamp (?v=...) para evitar caché vieja del navegador
                const response = await fetch(`stock.json?v=${new Date().getTime()}`);
                
                if (!response.ok) {
                    throw new Error(`No se pudo cargar stock.json (Error ${response.status})`);
                }

                // Leemos como ArrayBuffer para manejar tanto UTF-8 como Windows-1252 (acentos de Excel/CSV)
                const buffer = await response.arrayBuffer();
                let text = new TextDecoder('utf-8').decode(buffer);
                if (text.includes('\ufffd')) {
                    text = new TextDecoder('windows-1252').decode(buffer);
                }

                const data = JSON.parse(text);
                const rawList = Array.isArray(data) ? data : (data.productos || data.items || data.stock || Object.values(data)[0]);

                if (!Array.isArray(rawList)) {
                    throw new Error("El formato de stock.json no es una lista válida.");
                }

                // FILTRO PRINCIPAL: Solo mostrar cuando "Fecha Venta" esté vacío
                availableProducts = rawList.filter(item => {
                    const fechaVenta = item["Fecha Venta"];
                    return fechaVenta === undefined || fechaVenta === null || String(fechaVenta).trim() === "";
                });

                updateTabCounts();

                if (availableProducts.length === 0) {
                    statusEl.textContent = "No hay artículos disponibles en este momento.";
                    return;
                }

                statusEl.classList.add('hidden');
                gridEl.classList.remove('hidden');

                // Si no hay monedas disponibles pero sí billetes, abrir automáticamente la solapa que tenga stock
                if (filterByTab(availableProducts, 'M').length === 0) {
                    if (filterByTab(availableProducts, 'B').length > 0) {
                        selectTab('B');
                        return;
                    } else if (filterByTab(availableProducts, 'OTROS').length > 0) {
                        selectTab('OTROS');
                        return;
                    }
                }

                applyFilters();

            } catch (error) {
                console.error("Error cargando el stock:", error);
                statusEl.innerHTML = `
                    <p class="text-red-500 font-semibold">Error al cargar el inventario.</p>
                    <p class="text-xs mt-1">Verifica que 'stock.json' esté en la raíz del repositorio y sea un JSON válido.</p>
                `;
            }
        }

        // Función para dibujar las tarjetas en pantalla
        function renderProducts(products) {
            const gridEl = document.getElementById('productGrid');
            const counterEl = document.getElementById('counterText');
            
            gridEl.innerHTML = '';
            const tabLabels = { M: 'Monedas', B: 'Billetes', OTROS: 'Otros Coleccionables' };
            counterEl.textContent = `${tabLabels[activeTab]}: ${products.length} artículo${products.length === 1 ? '' : 's'} disponible${products.length === 1 ? '' : 's'}`;

            if (products.length === 0) {
                gridEl.innerHTML = `<p class="col-span-full text-center text-gray-500 py-8">No se encontraron artículos en esta categoría.</p>`;
                return;
            }
// ... existing code ...
        // Filtro de búsqueda en tiempo real (busca por Nro o Descripción dentro de la solapa activa)
        document.getElementById('searchInput').addEventListener('input', applyFilters);

        // Iniciar al cargar la página
        loadStock();
    </script>
