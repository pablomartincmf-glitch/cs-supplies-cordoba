<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS Supplies Córdoba</title>
    <!-- Tailwind CSS para un diseño moderno y responsive -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-50 text-gray-800">

    <!-- Encabezado y Buscador -->
    <header class="bg-white shadow-sm sticky top-0 z-10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <img src="logo/CS_Supplies.png" class="logo">
            <h1>CS Supplies Córdoba</h1>
            
            <div class="w-full sm:w-80 relative">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="Buscar productos..." 
                    class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm"
                >
                <svg class="w-5 h-5 text-gray-400 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
            </div>
        </div>
    </header>

    <!-- Contenedor Principal -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Mensaje de carga o error -->
        <div id="statusMessage" class="text-center py-12 text-gray-500">
            Cargando catálogo...
        </div>

        <!-- Grilla de Productos -->
        <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 hidden">
            <!-- Las tarjetas se generarán aquí con JavaScript -->
        </div>
    </main>

    <!-- Pie de página -->
    <footer class="bg-white border-t border-gray-200 mt-12 py-6 text-center text-sm text-gray-500">
        Actualizado automáticamente desde nuestro inventario.
    </footer>

    <script>
        let allProducts = [];

        // Función para cargar el archivo stock.json
        async function loadStock() {
            const statusEl = document.getElementById('statusMessage');
            const gridEl = document.getElementById('productGrid');

            try {
                // Agregamos un timestamp (?v=...) para evitar que el navegador guarde en caché una versión vieja del JSON
                const response = await fetch(`stock.json?v=${new Date().getTime()}`);
                
                if (!response.ok) {
                    throw new Error(`No se pudo cargar stock.json (Error ${response.status})`);
                }

                const data = await response.json();
                
                // Soporta tanto si el JSON es una lista directa [...] como si viene dentro de un objeto {"productos": [...]}
                allProducts = Array.isArray(data) ? data : (data.productos || data.items || data.stock || Object.values(data)[0]);

                if (!Array.isArray(allProducts) || allProducts.length === 0) {
                    statusEl.textContent = "No hay productos disponibles en este momento.";
                    return;
                }

                statusEl.classList.add('hidden');
                gridEl.classList.remove('hidden');
                renderProducts(allProducts);

            } catch (error) {
                console.error("Error cargando el stock:", error);
                statusEl.innerHTML = `
                    <p class="text-red-500 font-semibold">Error al cargar el inventario.</p>
                    <p class="text-xs mt-1">Asegúrate de que 'stock.json' esté en la misma carpeta que 'index.html' y tenga un formato válido.</p>
                `;
            }
        }

        // Función para dibujar las tarjetas en pantalla
        function renderProducts(products) {
            const gridEl = document.getElementById('productGrid');
            gridEl.innerHTML = '';

            if (products.length === 0) {
                gridEl.innerHTML = `<p class="col-span-full text-center text-gray-500 py-8">No se encontraron productos que coincidan con tu búsqueda.</p>`;
                return;
            }

            products.forEach(item => {
                // Adaptador inteligente de nombres de campos comunes en español/inglés
                const nombre = item.nombre || item.name || item.titulo || item.producto || 'Producto sin nombre';
                const precio = item.precio || item.price || item.valor || '';
                const imagen = item.imagen || item.image || item.img || item.foto || 'https://via.placeholder.com/400x300?text=Sin+Imagen';
                const stock = item.stock ?? item.cantidad ?? item.disponible ?? null;
                const descripcion = item.descripcion || item.description || item.detalle || '';

                // Determinar estado del stock
                let stockBadge = '';
                if (stock !== null) {
                    if (Number(stock) > 0 || stock === true) {
                        const textoStock = typeof stock === 'number' ? `Stock: ${stock}` : 'Disponible';
                        stockBadge = `<span class="inline-block bg-green-100 text-green-800 text-xs px-2 py-1 rounded-full font-medium">${textoStock}</span>`;
                    } else {
                        stockBadge = `<span class="inline-block bg-red-100 text-red-800 text-xs px-2 py-1 rounded-full font-medium">Sin stock</span>`;
                    }
                }

                // Formatear precio si es numérico
                const precioFormateado = precio !== '' 
                    ? (isNaN(precio) ? precio : `$${Number(precio).toLocaleString('es-AR')}`) 
                    : '';

                const card = document.createElement('div');
                card.className = 'product-card bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden flex flex-col justify-between transition-shadow hover:shadow-md';
                
                card.innerHTML = `
                    <div>
                        <div class="h-48 w-full overflow-hidden bg-gray-100 relative">
                            <img 
                                src="${imagen}" 
                                alt="${nombre}" 
                                class="w-full h-full object-cover transition-transform duration-300"
                                onerror="this.src='https://via.placeholder.com/400x300?text=Imagen+no+encontrada'"
                            >
                        </div>
                        <div class="p-4">
                            <div class="flex justify-between items-start gap-2 mb-2">
                                <h2 class="font-semibold text-gray-900 text-lg leading-snug">${nombre}</h2>
                            </div>
                            ${descripcion ? `<p class="text-gray-500 text-sm line-clamp-2 mb-3">${descripcion}</p>` : ''}
                        </div>
                    </div>
                    <div class="px-4 pb-4 pt-2 border-t border-gray-50 flex items-center justify-between">
                        <span class="text-xl font-bold text-blue-600">${precioFormateado}</span>
                        ${stockBadge}
                    </div>
                `;

                gridEl.appendChild(card);
            });
        }

        // Filtro de búsqueda en tiempo real
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = allProducts.filter(item => {
                const text = JSON.stringify(item).toLowerCase();
                return text.includes(term);
            });
            renderProducts(filtered);
        });

        // Iniciar al cargar la página
        loadStock();
    </script>
</body>
</html>
